38bdf8}.stat-lbl{font-weight:500;font-size:12px;fill:#94a3b8}.wave-line{stroke-dasharray:20,10;animation:pulse-wave 8s linear infinite}.scanning-line{animation:scanline 4s ease-in-out infinite}.animated-node{animation:float-node 4s ease-in-out infinite}.animated-cursor{animation:cursor-move 10s ease-in-out infinite}</style><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><g opacity=".15"><path stroke="#94a3b8" stroke-width="1" d="M0,40 H1200 M0,80 H1200 M0,120 H1200 M0,160 H1200 M0,200 H1200 M0,240 H1200 M0,280 H1200"/><path stroke="#94a3b8" stroke-width="1" d="M100,0 V320 M200,0 V320 M300,0 V320 M400,0 V320 M500,0 V320 M600,0 V320 M700,0 V320 M800,0 V320 M900,0 V320 M1000,0 V320 M1100,0 V320"/></g><g filter="url(#glow)"><path fill="none" stroke="url(#primaryGrad)" stroke-width="4" d="M 650 240 Q 720 180 780 220 T 900 170 T 1020 230 T 1150 160" class="wave-line"/><path fill="none" stroke="url(#cyanGrad)" stroke-dasharray="8 6" stroke-width="3" d="M 680 120 Q 750 260 850 140 T 1000 240 T 1120 120" opacity=".7"/></g><g class="animated-cursor"><circle r="18" fill="#8b5cf6" filter="url(#glow)" opacity=".25"/><circle r="6" fill="#38bdf8"/><path fill="#fff" stroke="#0f172a" stroke-width="1.5" d="M0,0 L12,16 L6,17 L3,24 L-1,23 L2,16 L-4,12 Z"/></g><line x1="0" x2="1200" y1="0" y2="0" stroke="#a855f7" stroke-width="2" class="scanning-line" filter="url(#glow)" opacity=".5"/><circle cx="1100" cy="80" r="120" fill="#8b5cf6" filter="url(#glow)" opacity=".15"/><circle cx="150" cy="270" r="90" fill="#06b6d4" filter="url(#glow)" opacity=".1"/><g><g><text x="0" y="0" class="title" filter="url(#shadow)" transform="translate(60, 0) translate(0, 75)">Awesome Behavioral Biometrics</text><text x="0" y="34" class="subtitle" transform="translate(60, 0) translate(0, 75)">Continuous Authentication • Keystroke Dynamics • Mouse Kinematics • AI Fraud Prevention</text></g><g><g transform="translate(60, 0) translate(0, 150) translate(0, 0)"><rect width="180" height="34" fill="#1e293b