<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'system-ui', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: 'system-ui', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .pill-text { font-family: 'system-ui', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    .stat-val { font-family: 'system-ui', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 22px; fill: #38bdf8; }
    .stat-lbl { font-family: 'system-ui', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 12px; fill: #94a3b8; }
    
    /* Dynamic Animations */
    @keyframes pulse-wave {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.6; }
      50% { stroke-dashoffset: 200; opacity: 1; }
    }
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(320px); opacity: 0.2; }
    }
    @keyframes float-node {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes cursor-move {
      0% { transform: translate(750px, 220px); }
      25% { transform: translate(820px, 160px); }
      50% { transform: translate(950px, 210px); }
      75% { transform: translate(880px, 250px); }
      100% { transform: translate(750px, 220px); }
    }
    
    .wave-line { stroke-dasharray: 20, 10; animation: pulse-wave 8s linear infinite; }
    .scanning-line { animation: scanline 4s ease-in-out infinite; }
    .animated-node { animation: float-node 4s ease-in-out infinite; }
    .animated-cursor { animation: cursor-move 10s ease-in-out infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid & Dynamic Graphic Elements -->
  <g opacity="0.15">
    <path d="M0,40 H1200 M0,80 H1200 M0,120 H1200 M0,160 H1200 M0,200 H1200 M0,240 H1200 M0,280 H1200" stroke="#94a3b8" stroke-width="1" />
    <path d="M100,0 V320 M200,0 V320 M300,0 V320 M400,0 V320 M500,0 V320 M600,0 V320 M700,0 V320 M800,0 V320 M900,0 V320 M1000,0 V320 M1100,0 V320" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Dynamic Behavioral Waveforms -->
  <g filter="url(#glow)">
    <path d="M 650 240 Q 720 180 780 220 T 900 170 T 1020 230 T 1150 160" fill="none" stroke="url(#primaryGrad)" stroke-width="4" class="wave-line" />
    <path d="M 680 120 Q 750 260 850 140 T 1000 240 T 1120 120" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.7" />
  </g>

  <!-- Interactive Dynamic Cursor Marker -->
  <g class="animated-cursor">
    <circle r="18" fill="#8b5cf6" opacity="0.25" filter="url(#glow)" />
    <circle r="6" fill="#38bdf8" />
    <path d="M0,0 L12,16 L6,17 L3,24 L-1,23 L2,16 L-4,12 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
  </g>

  <!-- Dynamic Scanline Visual Effect -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#a855f7" stroke-width="2" opacity="0.5" class="scanning-line" filter="url(#glow)" />

  <!-- Background Decorative Glowing Spheres -->
  <circle cx="1100" cy="80" r="120" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" />
  <circle cx="150" cy="270" r="90" fill="#06b6d4" opacity="0.1" filter="url(#glow)" />

  <!-- Foreground Main Content Container -->
  <g transform="translate(60, 0)">
    
    <!-- Header Title and Subtitle -->
    <g transform="translate(0, 75)">
      <text x="0" y="0" class="title" filter="url(#shadow)">Awesome Behavioral Biometrics</text>
      <text x="0" y="34" class="subtitle">Continuous Authentication • Keystroke Dynamics • Mouse Kinematics • AI Fraud Prevention</text>
    </g>

    <!-- Interactive Pill Highlights -->
    <g transform="translate(0, 150)">
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
        <circle cx="20" cy="17" r="6" fill="#6366f1" />
        <text x="36" y="22" class="pill-text">Keystroke Dynamics</text>
      </g>
      
      <g transform="translate(195, 0)">
        <rect width="175" height="34" rx="17" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
        <circle cx="20" cy="17" r="6" fill="#8b5cf6" />
        <text x="36" y="22" class="pill-text">Mouse Kinematics</text>
      </g>

      <g transform="translate(385, 0)">
        <rect width="175" height="34" rx="17" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
        <circle cx="20" cy="17" r="6" fill="#06b6d4" />
        <text x="36" y="22" class="pill-text">Zero Trust Passive MFA</text>
      </g>
    </g>

    <!-- Market Overview Stat Cards -->
    <g transform="translate(0, 215)">
      <g transform="translate(0, 0)" class="animated-node">
        <rect width="170" height="64" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)" />
        <rect width="170" height="3" rx="1.5" fill="#6366f1" />
        <text x="16" y="32" class="stat-val">$2.4B+</text>
        <text x="16" y="50" class="stat-lbl">Visas BioCatch Acquisition</text>
      </g>

      <g transform="translate(185, 0)" class="animated-node" style="animation-delay: 1s;">
        <rect width="170" height="64" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)" />
        <rect width="170" height="3" rx="1.5" fill="#8b5cf6" />
        <text x="16" y="32" class="stat-val">$9.2B</text>
        <text x="16" y="50" class="stat-lbl">Global Market by 2030</text>
      </g>

      <g transform="translate(370, 0)" class="animated-node" style="animation-delay: 2s;">
        <rect width="185" height="64" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)" />
        <rect width="185" height="3" rx="1.5" fill="#06b6d4" />
        <text x="16" y="32" class="stat-val">Concentrated</text>
        <text x="16" y="50" class="stat-lbl">Market Structure (M&amp;A)</text>
      </g>
    </g>

  </g>
</svg>
